services:

  order-api:
    build: ./OrderService

    ports:
      - "5001:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development

    depends_on:
      - redis
      - rabbitmq

  notification-api:
    build: ./NotificationService

    ports:
      - "5002:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  redis:
    image: redis:alpine

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest